services:
  - type: web
    name: skyscans-backend
    env: python
    rootDir: backend
    plan: starter
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt gunicorn uvicorn[standard]
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      
      - key: DATABASE_URL
        value: /data/skyscans_games.db
      - key: ALLOWED_ORIGINS
        # Add your production frontend URLs (comma-separated)
        value: https://your-frontend.example,https://your-frontend.onrender.com,http://localhost:3000
      # Optional: tune offline-friendly cache
      - key: API_CACHE_TTL
        value: "1800"
      - key: SEARCH_CACHE_TTL
        value: "600"
      - key: API_CACHE_DISABLE_EXPIRY
        value: "0"
      # Optional keys (set real values in Render dashboard as “Secret Files” or Env Vars)
      - key: RAWG_API_KEY
        sync: false
      - key: STEAM_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 3