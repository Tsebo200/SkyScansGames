services:
  - type: web
    name: skyscans-backend
    env: python
    rootDir: backend
    plan: starter
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:$PORT main:app
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        value: /data/skyscans_games.db
      - key: ALLOWED_ORIGINS
        value: https://your-frontend.example,https://your-frontend.onrender.com,http://localhost:3000
      - key: API_CACHE_TTL
        value: "1800"
      - key: SEARCH_CACHE_TTL
        value: "600"
      - key: API_CACHE_DISABLE_EXPIRY
        value: "0"
      - key: RAWG_API_KEY
        sync: false
      - key: STEAM_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 3